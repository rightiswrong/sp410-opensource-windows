name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a release for the version in VERSION (creates tag vX.Y.Z on this commit)"
        type: boolean
        default: false

jobs:
  build:
    # Everything is built on Linux with open-source tools only:
    # GCC (tests), MinGW-w64 (Windows binaries), NSIS (installer).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential gcc-mingw-w64-x86-64 nsis python3
      - name: Native build and tests (-Werror)
        run: scripts/ci-run.sh "native tests" make CFLAGS="-O2 -g -Werror" check
      - name: AddressSanitizer + UBSan
        run: |
          rm -rf build/native
          scripts/ci-run.sh "asan tests" make CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Werror" \
            LDFLAGS="-fsanitize=address,undefined" check
      - name: ThreadSanitizer
        run: |
          rm -rf build/native
          scripts/ci-run.sh "tsan tests" make CFLAGS="-O1 -g -fsanitize=thread -Werror" LDFLAGS="-fsanitize=thread" check
      - name: Windows x64 binaries (MinGW-w64)
        run: scripts/ci-run.sh "mingw build" make windows CFLAGS="-O2 -Werror"
      - name: Installer (NSIS)
        run: scripts/ci-run.sh "nsis" make installer CFLAGS="-O2 -Werror"
      - uses: actions/upload-artifact@v4
        with:
          name: sp410-opensource-windows
          path: |
            build/sp410-opensource-windows-*-setup.exe
            build/windows-x86_64/sp410-ippd.exe
            build/windows-x86_64/sp410-cli.exe
          if-no-files-found: error

  windows:
    # Runs the same test suite against the real .exe files, then installs the
    # package on a real Windows machine and prints through Windows' own
    # IPP Class Driver.
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sp410-opensource-windows
          path: build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test suite against the Windows binaries
        shell: pwsh
        run: |
          python tests/run_tests.py --ippd build/windows-x86_64/sp410-ippd.exe --cli build/windows-x86_64/sp410-cli.exe -v *> test-output.txt
          $rc = $LASTEXITCODE
          Get-Content test-output.txt
          if ($rc -ne 0) {
            $tail = (Get-Content test-output.txt -Tail 60) -join "%0A"
            Write-Output "::error title=Windows test suite::$tail"
            exit $rc
          }
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem installer/*.ps1, tests/*.ps1) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $errs | ForEach-Object { Write-Output "::error file=$($f.Name)::$($_.Message)" }; exit 1 }
          }
      - name: Install, print through Windows, uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem build/sp410-opensource-windows-*-setup.exe | Select-Object -First 1).FullName
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/e2e-windows.ps1 -Setup $setup *> e2e-output.txt
          $rc = $LASTEXITCODE
          Get-Content e2e-output.txt
          if ($rc -ne 0) {
            $tail = (Get-Content e2e-output.txt -Tail 70) -join "%0A"
            Write-Output "::error title=Windows end-to-end::$tail"
            exit $rc
          }
          $summary = (Select-String -Path e2e-output.txt -Pattern '^(printer:|captured|service running|status page|uninstalled|Added printer|Driver:|Add-Printer)' | ForEach-Object { $_.Line }) -join "%0A"
          Write-Output "::notice title=Windows end-to-end::$summary"
      - name: Decode the page Windows printed
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force e2e-capture | Out-Null
          Copy-Item C:\sp410-e2e\job-*.prn e2e-capture\
          $f = Get-ChildItem e2e-capture\job-*.prn | Select-Object -First 1
          python tools/tspl_decode.py $f.FullName --pbm-dir e2e-capture > e2e-capture\commands.txt
          Get-Content e2e-capture\commands.txt
          python -c "import sys; sys.path.insert(0,'tools'); import tspl_decode as t; s=t.parse(open(r'$($f.FullName)','rb').read()); l=s.labels[0]; print(l.width, l.height, l.black_dots()); assert (l.width, l.height) == (812, 1219) and l.black_dots() > 500, 'unexpected label'"
          $cmds = (Get-Content e2e-capture\commands.txt | Select-Object -First 14) -join "%0A"
          Write-Output "::notice title=TSPL from a Windows print job::$cmds"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-e2e-capture
          path: |
            e2e-capture
            e2e-output.txt
            test-output.txt
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y shellcheck
      - run: shellcheck scripts/*.sh
      - run: python3 -m py_compile tools/*.py tests/*.py

  release:
    # Runs for a pushed version tag (e.g. v1.0.0), or when started by hand
    # from the Actions tab with "publish_release" ticked - and only after the
    # build, the Windows test suite and the Windows install/print/uninstall
    # check have all passed in this same run. Publishes exactly those binaries.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: [build, windows, lint]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sp410-opensource-windows
          path: build
      - name: Work out the release tag
        run: |
          v="$(cat VERSION)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME}" != "v${v}" ]; then
              echo "::error title=Release::tag ${GITHUB_REF_NAME} does not match VERSION ${v}"
              exit 1
            fi
          elif [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error title=Release::manual releases are only made from main (got ${GITHUB_REF_NAME})"
            exit 1
          fi
          echo "VERSION=${v}" >> "$GITHUB_ENV"
          echo "TAG=v${v}" >> "$GITHUB_ENV"
      - name: Assemble release files
        run: |
          set -euo pipefail
          mkdir -p dist portable
          cp "build/sp410-opensource-windows-${VERSION}-setup.exe" dist/
          cp build/windows-x86_64/sp410-ippd.exe build/windows-x86_64/sp410-cli.exe \
             installer/add-printer.ps1 installer/remove-printer.ps1 installer/sp410.ini portable/
          cp README.md portable/README.txt
          cp LICENSE portable/LICENSE.txt
          (cd portable && zip -q -9 "../dist/sp410-opensource-windows-${VERSION}-x64-portable.zip" *)
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # Release notes: this version's CHANGELOG section plus checksums.
          awk -v v="${VERSION}" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}' CHANGELOG.md > notes.md
          {
            echo
            echo "### Install"
            echo
            echo "Download \`sp410-opensource-windows-${VERSION}-setup.exe\` and run it (64-bit Windows 10 or 11)."
            echo "The installer is not code-signed; if SmartScreen warns, choose **More info > Run anyway**."
            echo "The portable zip contains the same programs for manual or scripted setups (see docs/INSTALL.md)."
            echo
            echo "### SHA-256"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            echo "Built and tested by CI run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} from commit ${GITHUB_SHA}."
          } >> notes.md
          cat notes.md
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            # Release already exists (e.g. drafted in the GitHub UI): refresh it.
            gh release upload "${TAG}" dist/* --clobber
            gh release edit "${TAG}" --title "SP410 Open Driver for Windows ${VERSION}" --notes-file notes.md
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            gh release create "${TAG}" dist/* --verify-tag \
              --title "SP410 Open Driver for Windows ${VERSION}" --notes-file notes.md
          else
            # Manual run from main: tag the exact commit that was built and tested.
            gh release create "${TAG}" dist/* --target "${GITHUB_SHA}" \
              --title "SP410 Open Driver for Windows ${VERSION}" --notes-file notes.md
          fi
          gh release view "${TAG}" --json url,assets --jq '.url, (.assets[].name)'
