; sp410.ini - settings for the SP410 open-source driver (sp410-ippd).
; Changes to [device], [media] and [print] apply to the next label; changes to
; [server] need a restart of the "SP410 Open Driver" service
; (Services app, or an admin prompt: sc stop SP410IPP && sc start SP410IPP).

[server]
; Only this computer can print by default. Use 0.0.0.0 to share on the network.
listen = 127.0.0.1
port = 8631
name = iDPRT SP410
location =
; SP410, SP410BT or SP420
model = SP410
; debug, info, warn or error
log-level = info
max-job-mb = 64

[device]
; usb                         first iDPRT USB printer (default)
; usb:any                     first USB printer of any brand
; serial:COM5?baud=115200     SP410BT over Bluetooth (outgoing COM port)
; socket://192.168.1.50:9100  printer on a network print server
; spool:Name of a Windows printer   send RAW data through an existing queue
uri = usb
; seconds without progress before a job fails (paper out, cover open)
stall-timeout = 120
; seconds to keep retrying when the printer is off or unplugged
retry-timeout = 300

[media]
; default label size: na_index-4x6_4x6in, oe_4x2-label_4x2in, om_100x150-label_100x150mm ...
default = na_index-4x6_4x6in

[print]
; Same options as the Linux driver. Remove the ';' to change a setting.
; Darkness = Default        ; Default or 0-15
; PrintSpeed = Default      ; Default or 2-6 inches per second
; MediaTracking = Gap       ; Gap, BlackMark or Continuous
; GapHeight = 3             ; mm
; GapOffset = 0             ; mm
; PrintDirection = Normal   ; Normal or Rotate180
; TearOff = True            ; advance the label to the tear bar
; TearOffset = 0            ; mm, -10 to 10
; Dither = Auto             ; Auto, Threshold, Atkinson, FloydSteinberg, Ordered
; Threshold = 128           ; 1-254, lower is darker
; ShiftX = 0                ; mm
; ShiftY = 0                ; mm
